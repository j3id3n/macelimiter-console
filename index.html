<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MaceLimiter Remote Console</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080b10;color:#e9edf3;font:14px system-ui,-apple-system,Segoe UI,sans-serif}.app{display:grid;grid-template-columns:290px 1fr;min-height:100vh}.side{padding:20px;background:#0d1219;border-right:1px solid #252d38}.main{padding:22px;max-width:1500px;width:100%;margin:auto}.brand{font-size:21px;font-weight:800}.muted{color:#8e9aaa;font-size:12px}.server,.card{background:#111822;border:1px solid #283240;border-radius:12px}.server{width:100%;color:#fff;text-align:left;margin-top:9px;padding:13px;cursor:pointer}.server:hover,.server.active{border-color:#7285ff;background:#151d2b}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#42d47b;margin-right:8px}.offline .dot{background:#697381}.status{margin-top:5px;color:#67e09a;font-size:11px}.card{padding:16px}.empty{margin-top:0}.hidden{display:none}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.grid{display:grid;grid-template-columns:1.35fr .65fr;gap:14px;margin-top:14px}.console{height:360px;background:#05070a;border-radius:8px;padding:11px;overflow:auto;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap}.row{display:flex;gap:8px;margin-top:9px}.row input{flex:1}.input{background:#090d13;color:white;border:1px solid #303b49;border-radius:8px;padding:10px;outline:none}.btn{background:#667cff;color:white;border:0;border-radius:8px;padding:10px 14px;cursor:pointer}.btn:hover{filter:brightness(1.1)}.danger{background:#8b3d4a}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.stat{background:#0b1017;border:1px solid #252f3b;border-radius:9px;padding:10px}.num{font-size:24px;font-weight:800;margin-top:3px}.loc{display:grid;grid-template-columns:70px 1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid #222b35}.coord{font-family:ui-monospace,monospace;color:#9bb7ff}.pill{font-size:11px;padding:3px 7px;border-radius:99px;background:#1c2633;color:#aab6c6}.notice{margin-top:12px;padding:10px;border-radius:8px;background:#151c27;color:#aeb9c8}.ok{color:#67e09a}.err{color:#ff8f9b}@media(max-width:850px){.app{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid #252d38}}
</style></head>
<body><div class="app">
<aside class="side"><div class="brand">MaceLimiter</div><div class="muted" style="margin-top:3px">Connected Minecraft servers</div><div id="servers"></div><div id="discoveryStatus" class="notice">Discovering servers…</div></aside>
<main class="main">
<div id="empty" class="card empty"><b>No server selected</b><div class="muted" style="margin-top:6px">Servers running MaceLimiter 1.1.7+ will appear automatically.</div></div>
<div id="panel" class="hidden">
<div class="card"><div class="top"><div><h2 id="name" style="margin:0"></h2><div id="meta" class="muted"></div></div><span id="online" class="pill">ONLINE</span></div>
<div class="row"><input id="token" class="input" type="password" placeholder="Server access token"><button id="connect" class="btn">Authenticate</button></div><div id="authStatus" class="muted" style="margin-top:7px"></div></div>
<div class="grid">
<section class="card"><b>Live Console</b><div id="console" class="console" style="margin-top:10px"></div><div class="row"><input id="command" class="input" placeholder="Minecraft console command"><button id="send" class="btn">Run</button></div></section>
<section class="card"><b>Mace Tracking</b><div class="stats"><div class="stat">Total<div id="count" class="num">—</div></div><div class="stat">Storage<div id="storage" class="num">—</div></div><div class="stat">Ground<div id="ground" class="num">—</div></div></div><h3>Locations</h3><div id="locations"></div></section>
</div></div></main></div>
<script>
const DS=["https://ntfy.sh/macelimiter-discovery-v3", "https://ntfy.tedomum.fr/macelimiter-discovery-v3", "https://ntfy.jae.fi/macelimiter-discovery-v3", "https://ntfy.adminforge.de/macelimiter-discovery-v3", "https://ntfy.envs.net/macelimiter-discovery-v3"];
const S=new Map();let sel=null,es=null,authed=false,sess='';
const $=id=>document.getElementById(id);
function b(s){try{let x=s.replace(/-/g,'+').replace(/_/g,'/');x+='='.repeat((4-x.length%4)%4);return decodeURIComponent(escape(atob(x)))}catch(e){return s||''}}
function pub(t,m){return fetch(t,{method:'POST',body:m,cache:'no-store'}).catch(()=>{})}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(){const q=$('servers');q.innerHTML='';const arr=[...S.values()].sort((a,b)=>a.name.localeCompare(b.name));if(!arr.length){q.innerHTML='<div class="notice">No MaceLimiter servers discovered yet.</div>';return}arr.forEach(s=>{const x=document.createElement('button');x.className='server '+(sel?.id===s.id?'active':'');x.innerHTML='<span class="dot"></span><b>'+esc(s.name)+'</b><div class="muted">MaceLimiter '+esc(s.version)+'</div><div class="status">'+(s.online?'ONLINE':'OFFLINE')+'</div>';x.onclick=()=>select(s);q.appendChild(x)})}
function select(s){sel=s;$('empty').classList.add('hidden');$('panel').classList.remove('hidden');$('name').textContent=s.name;$('meta').textContent='MaceLimiter '+s.version+' · '+s.id;$('online').textContent=s.online?'ONLINE':'OFFLINE';$('token').value=localStorage.getItem('ml-'+s.id)||'';$('console').textContent='';$('authStatus').textContent='';authed=false;if(es){es.close();es=null}render()}
function connect(){if(!sel)return;const t=$('token').value.trim();if(!t){$('authStatus').textContent='Enter the server access token.';return}localStorage.setItem('ml-'+sel.id,t);sess=crypto.randomUUID();authed=false;if(es)es.close();es=new EventSource(sel.topic+'/sse');es.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.event==='message')handle(m.message)}catch{}};es.onerror=()=>$('authStatus').textContent='Relay connection lost; retrying…';setTimeout(()=>pub(sel.topic,'AUTH|'+sess+'|'+t),300)}
function log(x){const c=$('console');c.textContent+=(c.textContent?'\n':'')+x;c.scrollTop=c.scrollHeight}
function handle(m){
if(m==='AUTHOK|'+sess){authed=true;$('authStatus').innerHTML='<span class="ok">Authenticated.</span>';pub(sel.topic,'GETSTATE|'+sess);return}
if(m.startsWith('LOG|')){if(authed)log(m.slice(4));return}
if(!authed)return;
if(m.startsWith('COUNT|')){$('count').textContent=m.split('|')[2]||'0';return}
if(m.startsWith('MACE|')){draw(b(m.split('|')[2]||''));return}
if(m.startsWith('MACE|'+sess+'|')){draw(b(m.split('|')[2]||''));return}
}
function draw(raw){let rows=raw.split(';').filter(Boolean).map(x=>{let p=x.split('~');return{id:p[0],k:p[1],o:p[2],w:p[3],x:p[4],y:p[5],z:p[6],path:p[7]||''}});let storage=rows.filter(r=>r.k==='STORAGE'),ground=rows.filter(r=>r.k==='GROUND');$('storage').textContent=storage.length;$('ground').textContent=ground.length;$('locations').innerHTML=rows.map(r=>'<div class="loc"><span class="pill">'+esc(r.k)+'</span><span><b>'+esc(r.o)+'</b><div class="muted">'+esc(r.path)+'</div></span><span class="coord">'+esc(r.w)+': '+r.x+', '+r.y+', '+r.z+'</span></div>').join('')||'<div class="muted">No maces detected.</div>'}
$('connect').onclick=connect;$('send').onclick=()=>{const c=$('command').value.trim();if(authed&&c){pub(sel.topic,'CMD|'+sess+'|'+c);$('command').value=''}};
async function discover(){
  try{
    const now=Date.now();
    const results=await Promise.all(DS.map(async d=>{
      try{
        const r=await fetch(d+'/json?poll=1&since=all&t='+now,{cache:'no-store'});
        if(!r.ok) return '';
        return await r.text();
      }catch(e){return ''}
    }));
    for(const text of results){
      for(const line of text.split(/\r?\n/)){
        if(!line) continue;
        try{
          const j=JSON.parse(line);
          if(j.event!=='message') continue;
          if(j.time && now-(Number(j.time)*1000)>60000) continue;
          const p=j.message.split('|');
          if(p[0]!=='DISCOVER'||p.length<6) continue;
          const id=p[1];
          S.set(id,{id,name:b(p[2]),version:p[3],topic:b(p[4]),online:p[5]==='ONLINE',last:now});
        }catch(e){}
      }
    }
    for(const [id,s] of S){
      s.online=now-s.last<45000;
      if(!s.online&&sel?.id===id) $('online').textContent='OFFLINE';
    }
    $('discoveryStatus').innerHTML='<span class="ok">Discovery connected</span>';
    render();
  }catch(e){
    $('discoveryStatus').innerHTML='<span class="err">Discovery unavailable — retrying</span>';
  }
}
discover();setInterval(discover,5000);
</script></body></html>
